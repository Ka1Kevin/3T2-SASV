### train configuraton

exp_dir: exp/ResNet18-TSTP-emb256-fbank80-num_frms200-aug0.6-spTrue-saFalse-ArcMargin-SGD-epoch100
gpus: [0,1]
num_avg: 10
enable_amp: False # whether enable automatic mixed precision training

seed: 42
num_epochs: 50
save_epoch_interval: 1 # save model every 5 epochs
log_batch_interval: 100 # log every 100 batchs

dataloader_args:
  batch_size: 16
  num_workers: 6
  pin_memory: False
  prefetch_factor: 8
  drop_last: True

dataset_args:
  # the sample number which will be traversed within one epoch, if the value equals to 0,
  # the utterance number in the dataset will be used as the sample_num_per_epoch.
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 100
    max_num_frames: 800
  resample_rate: 16000
  speed_perturb: False
  num_frms: 200
  aug_prob: 0 # prob to add reverb & noise aug per sample
  fbank_args:
    num_mel_bins: 80
    frame_shift: 10
    frame_length: 25
    dither: 0.0
  spec_aug: True
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6
  #TODO move rawboost parameters to here.

model: SKA_TDNN
model_init: /export/fs05/ktan17/SASV2_Baseline/pretrained_weight/SKA_TDNN.model
model_args:
  eca_c: 1024
  eca_s: 8 
  log_input: True 
  num_mels: 80
  num_out: 192
  embed_dim: 192
projection_args:
  project_type: "softmax" # add_margin, arc_margin, sphere, sphereface2, softmax, arc_margin_intertopk_subcenter
  scale: 32.0
  easy_margin: False
fusion_type: "xattn_add" # feat_cat, time_cat, xattn_add

# loss: LossFunction
# loss_args:
#   num_out: 384
#   num_class: 3
#   margin: 0.2
#   scale: 32
#   easy_margin: False
loss: LossFunction
loss_args: {}

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.0
  increase_start_epoch: 20
  fix_start_epoch: 40
  update_margin: True
  increase_type: "exp" # exp, linear


optimizer: AdamW
optimizer_args:
  weight_decay: 0.0001


scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 0.001
  final_lr: 0.00005
  warm_up_epoch: 10
  warm_from_zero: True

